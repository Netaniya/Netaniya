name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['portfolio/**', 'pages/**', 'scripts/build-pages.mjs', 'tests/pages.test.mjs', '.github/workflows/portfolio-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            portfolio/motion-atelier/package-lock.json
            portfolio/eliana-n25x/package-lock.json
      - run: npm ci --ignore-scripts --prefix portfolio/motion-atelier
      - run: npm ci --ignore-scripts --prefix portfolio/eliana-n25x
      - name: Build and verify public projects
        run: |
          node scripts/build-pages.mjs
          npm run check --prefix portfolio/eliana-n25x
          npm test --prefix portfolio/eliana-n25x
          node --test tests/pages.test.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
