<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AI Request Desk: a learning portfolio by Natalie Ragulina. Four-language request workflow with invoice checks and human approval."><title>AI Request Desk · Lernportfolio</title><link rel="stylesheet" href="style.css?v=3"><script defer src="engine.js"></script><script defer src="ui.js?v=3"></script></head>
<body><header class="topbar"><a class="brand" href="#"><span class="mark">AR</span><span>AI Request Desk<small>Natalie Ragulina (Netaniya)</small></span></a><div class="language"><label for="ui-lang" id="language-label"></label><select id="ui-lang"><option value="en">English</option><option value="de">Deutsch</option><option value="ru">Русский</option><option value="uk">Українська</option></select></div></header>
<div class="workspace"><aside class="sidebar"><div class="nav-title" id="workspace-label"></div><div class="nav-item active" id="inbox-nav"></div><div class="side-note"><span class="mini-mark">01</span><h3 id="side-title"></h3><p id="side-desc"></p></div><div class="side-bottom"><span class="status-dot"></span><span id="local-label"></span></div></aside><main>
<div class="page-heading"><div><p class="eyebrow" id="eyebrow"></p><h1 id="heading"></h1><p id="subheading"></p></div><button id="new-request" class="primary"></button></div>
<div class="learning-banner"><span class="banner-icon">◇</span><div><strong id="learning-title"></strong><p id="learning-desc"></p></div></div>
<div class="metrics"><div><span id="metric-total-label"></span><strong id="metric-total">0</strong></div><div><span id="metric-review-label"></span><strong id="metric-review">0</strong></div><div><span id="metric-approved-label"></span><strong id="metric-approved">0</strong></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<section id="composer" class="composer panel" hidden><div class="panel-heading"><h2 id="compose-title"></h2><button id="close-compose" class="ghost"></button></div><form id="request-form"><label for="subject" id="subject-label"></label><input id="subject" maxlength="200" required><label for="body" id="body-label"></label><textarea id="body" maxlength="10000" required rows="4"></textarea><div class="form-footer"><div><label for="create-lang" id="create-lang-label"></label><select id="create-lang"><option value="de">Deutsch</option><option value="en">English</option><option value="ru">Русский</option><option value="uk">Українська</option></select></div><button type="submit" id="create-button" class="primary"></button></div></form></section>
<div class="desk-grid"><section class="queue panel"><div class="panel-heading"><h2 id="queue-heading"></h2><span id="queue-count" class="count"></span></div><label class="sr-only" for="search" id="search-label"></label><input id="search" type="search"><label class="sr-only" for="filter" id="filter-label"></label><select id="filter"></select><div id="queue" aria-live="polite"></div><button id="reset" class="ghost full"></button></section><section class="detail panel" id="detail" aria-live="polite"></section></div>
<section class="about panel"><div><p class="eyebrow" id="about-eyebrow"></p><h2 id="about-title"></h2><p id="about-desc"></p></div><details><summary id="rules-title"></summary><ol id="rules-list"></ol></details></section>
<footer><span>© 2026 Natalie Ragulina (Netaniya)</span><span id="footer-note"></span></footer>
</main></div></body></html>
